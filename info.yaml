project:
  title: "Adaptive-Neuromorphic-E-Skin-Readout-IC"
  team: "SneakyGolem"
  discord: "ugie8443, jeanette_25749"
  description: "Low-Power Adaptive Threshold Neuromorphic Interface for MEMS-Based Electronic"
  lvs_config: "lvs_config.json"

# ======================================================
# Pin Data 
# ======================================================
pins:
  - name: vdd!
    io_type: power
  - name: gnd!
    io_type: ground
  - name: clk
    io_type: input_cmos
  - name: SenseA
    io_type: analog
    secondary_esd: false
  - name: Vbiadapt
    io_type: analog
    secondary_esd: false
  - name: Vleak
    io_type: analog
    secondary_esd: false
  - name: Vmem
    io_type: analog
    secondary_esd: false
  - name: Vadapt
    io_type: analog
    secondary_esd: false
  - name: ST
    io_type: output_cmos
  - name: Vout
    io_type: analog
    secondary_esd: false
